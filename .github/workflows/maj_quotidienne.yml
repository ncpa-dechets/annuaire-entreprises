name: Mise à jour quotidienne de l'annuaire

on:
  schedule:
    - cron: "15 4 * * *"      # chaque nuit à 4h15 UTC (5h15 ou 6h15 à Paris)
  workflow_dispatch:           # bouton « Run workflow » pour lancer à la main
    inputs:
      forcer:
        description: "Forcer l'écriture même si le nombre d'établissements chute (FORCER=1)"
        required: false
        default: "0"

permissions:
  contents: write              # autorise le robot à enregistrer les données dans le dépôt

concurrency:
  group: collecte
  cancel-in-progress: false

jobs:
  collecte:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-collecte.txt

      - name: Installer les dépendances
        run: pip install -r requirements-collecte.txt

      - name: Collecter les établissements
        env:
          INSEE_API_KEY: ${{ secrets.INSEE_API_KEY }}
          FORCER: ${{ github.event.inputs.forcer || '0' }}
        run: python collecte.py

      - name: Enregistrer les données dans le dépôt
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "Aucun changement aujourd'hui."
          else
            git commit -m "Données SIRENE du $(TZ=Europe/Paris date +%F)"
            git push
          fi
